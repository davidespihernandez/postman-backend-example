$kind: http-request
description: Returns a single item identified by its integer ID.
url: "{{baseUrl}}/items/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "42"
    description: The integer ID of the item.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "example": 42
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
examples: ./.resources/Get item by ID.resources/examples
order: 1000

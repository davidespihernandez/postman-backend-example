$kind: http-request
url: "{{baseUrl}}/items/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "9637"
    description: Item ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "Widget Pro Max",
      "description": "An upgraded high-quality widget for professional use"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "example": "SKU-001",
          "description": "Unique stock-keeping unit identifier"
        },
        "name": {
          "type": "string",
          "example": "Widget Pro",
          "description": "Name of the item"
        },
        "description": {
          "type": "string",
          "example": "A high-quality widget for professional use",
          "description": "Optional description of the item"
        }
      }
    }
examples: ./.resources/Partial update of an item.resources/examples
order: 3000

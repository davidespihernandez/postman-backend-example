$kind: http-example
name: Internal server error.
request:
  url: "{{baseUrl}}/items/:id"
  method: DELETE
  headers:
    Accept: application/json
  pathVariables:
    - key: id
      value: "6778"
      description: The unique integer ID of the item.
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 500,
        "message": "An unexpected error occurred. Please try again later."
      }
    $type: |-
      {
        "description": "A standard error response body.",
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 404,
            "description": "HTTP status code or application-specific error code."
          },
          "message": {
            "type": "string",
            "example": "Item not found.",
            "description": "Human-readable description of the error."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 3000

$kind: http-example
name: Item not found.
request:
  url: "{{baseUrl}}/items/:id"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: id
      value: "6778"
      description: The unique integer ID of the item.
  body:
    type: json
    content: |-
      {
        "sku": "<string>",
        "name": "Blue Widget Revised",
        "description": "Updated description for the blue widget."
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 404,
        "message": "Item not found."
      }
    $type: |-
      {
        "description": "A standard error response body.",
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 404,
            "description": "HTTP status code or application-specific error code."
          },
          "message": {
            "type": "string",
            "example": "Item not found.",
            "description": "Human-readable description of the error."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000

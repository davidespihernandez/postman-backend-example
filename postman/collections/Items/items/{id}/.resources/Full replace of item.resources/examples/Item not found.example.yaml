$kind: http-example
request:
  url: "{{baseUrl}}/items/:id"
  method: PUT
  headers:
    Content-Type: application/json
    Accept: application/json
  pathVariables:
    - key: id
      value: "3580"
      description: Unique integer identifier of the item
  body:
    type: json
    content: |-
      {
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "description": "A small blue widget used in assembly line B."
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 404,
        "message": "Item not found."
      }
    $type: |-
      {
        "description": "Standard error response returned when a request cannot be fulfilled.",
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "description": "HTTP status code or application-specific error code."
          },
          "message": {
            "type": "string",
            "description": "Human-readable description of the error."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000

$kind: http-request
description: Partially updates an existing item. Only the provided fields are changed.
url: "{{baseUrl}}/items/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "6778"
    description: The unique integer ID of the item.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": "<integer>"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "sku": "<string>",
      "name": "Blue Widget Revised",
      "description": "Updated description for the blue widget."
    }
  $type: |-
    {
      "description": "Payload for partially updating an item. All fields are optional; only provided fields are updated.",
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "example": "WIDGET-001-REV2",
          "description": "Unique stock-keeping unit identifier for the item."
        },
        "name": {
          "type": "string",
          "example": "Blue Widget Revised",
          "description": "Human-readable name of the item."
        },
        "description": {
          "type": "string",
          "example": "Updated description for the blue widget.",
          "description": "Optional longer description of the item."
        }
      }
    }
examples: ./.resources/Partial update item.resources/examples
order: 3000

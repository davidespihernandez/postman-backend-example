$kind: http-request
description: Fully replaces an existing item with the provided data. All writable fields must be supplied.
url: "{{baseUrl}}/items/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "3580"
    description: Unique integer identifier of the item
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "sku": "WIDGET-001",
      "name": "Blue Widget",
      "description": "A small blue widget used in assembly line B."
    }
  $type: |-
    {
      "description": "Payload for creating a new item (POST) or fully replacing an existing one (PUT).",
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "description": "Stock-keeping unit — must be unique across all items."
        },
        "name": {
          "type": "string",
          "description": "Human-readable name of the item."
        },
        "description": {
          "type": "string",
          "description": "Optional longer description of the item."
        }
      },
      "required": [
        "sku",
        "name"
      ]
    }
examples: ./.resources/Full replace of item.resources/examples
order: 2000

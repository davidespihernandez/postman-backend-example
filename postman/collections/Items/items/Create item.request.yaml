$kind: http-request
description: Creates a new item with the provided data.
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "WIDGET-001",
      "name": "Blue Widget",
      "description": "A small blue widget used in assembly line B."
    }
  $type: |-
    {
      "description": "Payload for creating a new item (POST) or fully replacing an existing one (PUT).",
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "description": "Stock-keeping unit — must be unique across all items."
        },
        "name": {
          "type": "string",
          "description": "Human-readable name of the item."
        },
        "description": {
          "type": "string",
          "description": "Optional longer description of the item."
        }
      },
      "required": [
        "sku",
        "name"
      ]
    }
examples: ./.resources/Create item.resources/examples
order: 2000

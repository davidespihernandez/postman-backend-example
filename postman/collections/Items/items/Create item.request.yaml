$kind: http-request
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "SKU-001",
      "name": "Widget Pro",
      "description": "A high-quality widget for professional use"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "example": "SKU-001",
          "description": "Unique stock-keeping unit identifier"
        },
        "name": {
          "type": "string",
          "example": "Widget Pro",
          "description": "Name of the item"
        },
        "description": {
          "type": "string",
          "example": "A high-quality widget for professional use",
          "description": "Optional description of the item"
        }
      },
      "required": [
        "sku",
        "name"
      ]
    }
examples: ./.resources/Create item.resources/examples
order: 2000

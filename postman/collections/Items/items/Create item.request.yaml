$kind: http-request
description: Creates a new item and returns the created resource including its server-assigned ID.
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "sku": "WIDGET-001",
      "name": "Blue Widget",
      "description": "A small blue widget used in assembly line B."
    }
  $type: |-
    {
      "description": "Payload for creating or fully replacing an item. The `id` is assigned by the server and must not be provided.",
      "type": "object",
      "properties": {
        "sku": {
          "type": "string",
          "example": "WIDGET-001",
          "description": "Unique stock-keeping unit identifier for the item."
        },
        "name": {
          "type": "string",
          "example": "Blue Widget",
          "description": "Human-readable name of the item."
        },
        "description": {
          "type": "string",
          "example": "A small blue widget used in assembly line B.",
          "description": "Optional longer description of the item."
        }
      },
      "required": [
        "sku",
        "name"
      ]
    }
examples: ./.resources/Create item.resources/examples
order: 2000

$kind: http-request
name: List items
description: Returns a paginated list of all items.
url: "{{baseUrl}}/items?page=1&size=20"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number (1-based).
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1,
            "example": 1
          }
        }
      }
  - key: size
    value: "20"
    disabled: false
    description: Number of items per page.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100,
            "example": 20
          }
        }
      }
body:
  type: text
  content: ""
examples: ./.resources/List items.resources/examples
order: 1000

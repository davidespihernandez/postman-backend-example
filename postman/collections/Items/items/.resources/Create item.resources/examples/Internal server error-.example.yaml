$kind: http-example
name: Internal server error.
request:
  url: "{{baseUrl}}/items"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "description": "A small blue widget used in assembly line B."
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 500,
        "message": "An unexpected error occurred. Please try again later."
      }
    $type: |-
      {
        "description": "A standard error response body.",
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 404,
            "description": "HTTP status code or application-specific error code."
          },
          "message": {
            "type": "string",
            "example": "Item not found.",
            "description": "Human-readable description of the error."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 2000

$kind: http-example
request:
  url: "{{baseUrl}}/items"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "description": "A small blue widget used in assembly line B."
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "sku": "WIDGET-001",
        "name": "Blue Widget",
        "description": "A small blue widget used in assembly line B."
      }
    $type: |-
      {
        "description": "A fully-hydrated Item resource, including the server-assigned id.",
        "type": "object",
        "properties": {
          "sku": {
            "type": "string",
            "description": "Stock-keeping unit — must be unique across all items."
          },
          "name": {
            "type": "string",
            "description": "Human-readable name of the item."
          },
          "description": {
            "type": "string",
            "description": "Optional longer description of the item."
          }
        },
        "required": [
          "id",
          "sku",
          "name"
        ]
      }
order: 1000

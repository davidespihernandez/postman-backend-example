openapi: 3.1.0
info:
  title: Items API
  version: 1.0.0
  description: |-
    A RESTful API for managing Item resources with full CRUD operations.
    Supports listing (with pagination), creating, retrieving, updating (full and partial), and deleting items.

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /items:
    get:
      summary: List items
      description: Returns a paginated list of all items.
      operationId: listItems
      tags:
        - Items
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A paginated list of items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                ItemListExample:
                  $ref: '#/components/examples/ItemListExample'

    post:
      summary: Create item
      description: Creates a new item with the provided data.
      operationId: createItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              ItemCreateExample:
                $ref: '#/components/examples/ItemCreateExample'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'

  /items/{id}:
    parameters:
      - name: id
        in: path
        description: Unique integer identifier of the item
        required: true
        schema:
          type: integer

    get:
      summary: Get item by ID
      description: Retrieves a single item by its unique identifier.
      operationId: getItem
      tags:
        - Items
      responses:
        '200':
          description: The requested item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ErrorNotFoundExample:
                  $ref: '#/components/examples/ErrorNotFoundExample'

    put:
      summary: Full replace of item
      description: Fully replaces an existing item with the provided data. All writable fields must be supplied.
      operationId: replaceItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              ItemCreateExample:
                $ref: '#/components/examples/ItemCreateExample'
      responses:
        '200':
          description: Item replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ErrorNotFoundExample:
                  $ref: '#/components/examples/ErrorNotFoundExample'

    patch:
      summary: Partial update of item
      description: Partially updates an existing item. Only the fields provided in the request body are updated.
      operationId: updateItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
            examples:
              ItemPatchExample:
                $ref: '#/components/examples/ItemPatchExample'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ErrorNotFoundExample:
                  $ref: '#/components/examples/ErrorNotFoundExample'

    delete:
      summary: Delete item
      description: Permanently deletes an item by its unique identifier.
      operationId: deleteItem
      tags:
        - Items
      responses:
        '204':
          description: Item deleted successfully — no content returned
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ErrorNotFoundExample:
                  $ref: '#/components/examples/ErrorNotFoundExample'

components:
  schemas:
    Item:
      type: object
      description: A fully-hydrated Item resource, including the server-assigned id.
      required:
        - id
        - sku
        - name
      properties:
        id:
          type: integer
          description: Sequential, read-only, server-assigned unique identifier.
          readOnly: true
          examples:
            - 1
        sku:
          type: string
          description: Stock-keeping unit — must be unique across all items.
          examples:
            - WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          examples:
            - Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          examples:
            - A small blue widget used in assembly line B.

    ItemCreate:
      type: object
      description: Payload for creating a new item (POST) or fully replacing an existing one (PUT).
      required:
        - sku
        - name
      properties:
        sku:
          type: string
          description: Stock-keeping unit — must be unique across all items.
          examples:
            - WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          examples:
            - Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          examples:
            - A small blue widget used in assembly line B.

    ItemPatch:
      type: object
      description: Payload for partially updating an existing item (PATCH). All fields are optional.
      properties:
        sku:
          type: string
          description: Stock-keeping unit — must be unique across all items.
          examples:
            - WIDGET-001-REVISED
        name:
          type: string
          description: Human-readable name of the item.
          examples:
            - Blue Widget (Revised)
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          examples:
            - Updated description for the blue widget.

    ItemList:
      type: object
      description: A paginated list of Item resources.
      required:
        - total
        - next
        - prev
        - items
      properties:
        total:
          type: integer
          description: Total number of items across all pages.
          examples:
            - 42
        next:
          type: string
          nullable: true
          description: URL to fetch the next page of results, or null if on the last page.
          examples:
            - 'http://localhost:3000/items?page=3&size=20'
        prev:
          type: string
          nullable: true
          description: URL to fetch the previous page of results, or null if on the first page.
          examples:
            - 'http://localhost:3000/items?page=1&size=20'
        items:
          type: array
          description: Array of Item objects for the current page.
          items:
            $ref: '#/components/schemas/Item'

    Error:
      type: object
      description: Standard error response returned when a request cannot be fulfilled.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code or application-specific error code.
          examples:
            - 404
        message:
          type: string
          description: Human-readable description of the error.
          examples:
            - Item not found.

  examples:
    ItemExample:
      summary: A sample Item object
      value:
        id: 1
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    ItemCreateExample:
      summary: Sample payload for creating or fully replacing an item
      value:
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    ItemPatchExample:
      summary: Sample payload for partially updating an item
      value:
        name: Blue Widget (Revised)
        description: Updated description for the blue widget.

    ItemListExample:
      summary: Sample paginated list response
      value:
        total: 42
        next: 'http://localhost:3000/items?page=3&size=20'
        prev: 'http://localhost:3000/items?page=1&size=20'
        items:
          - id: 21
            sku: WIDGET-021
            name: Green Widget
            description: A medium green widget for outdoor use.
          - id: 22
            sku: WIDGET-022
            name: Red Widget
            description: null
          - id: 23
            sku: GADGET-001
            name: Pocket Gadget
            description: A compact gadget that fits in any pocket.

    ErrorNotFoundExample:
      summary: Sample 404 error response
      value:
        code: 404
        message: Item not found.

tags:
  - name: Items
    description: Operations on the Item resource

openapi: 3.0.3
info:
  title: Items API
  version: 1.0.0
  description: >
    A RESTful API for managing Item resources. Supports full CRUD operations:
    listing items with pagination, creating new items, retrieving a single item
    by ID, replacing an item (full update), partially updating an item, and
    deleting an item.

servers:
  - url: /api/v1

paths:
  /items:
    get:
      summary: List items
      description: Returns a paginated list of all items.
      operationId: listItems
      tags:
        - Items
      parameters:
        - name: page
          in: query
          description: Page number (1-based).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          description: Number of items per page.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
      responses:
        '200':
          description: A paginated list of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                ItemListExample:
                  $ref: '#/components/examples/ItemListExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

    post:
      summary: Create item
      description: Creates a new item and returns the created resource including its server-assigned ID.
      operationId: createItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              ItemCreateExample:
                $ref: '#/components/examples/ItemCreateExample'
      responses:
        '201':
          description: The newly created item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

  /items/{id}:
    parameters:
      - name: id
        in: path
        description: The unique integer ID of the item.
        required: true
        schema:
          type: integer

    get:
      summary: Get item detail
      description: Returns a single item by its ID.
      operationId: getItem
      tags:
        - Items
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundExample:
                  $ref: '#/components/examples/NotFoundExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

    put:
      summary: Replace item
      description: Fully replaces an existing item. All writable fields must be provided.
      operationId: replaceItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              ItemCreateExample:
                $ref: '#/components/examples/ItemCreateExample'
      responses:
        '200':
          description: The updated item after full replacement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundExample:
                  $ref: '#/components/examples/NotFoundExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

    patch:
      summary: Partial update item
      description: Partially updates an existing item. Only the provided fields are changed.
      operationId: partialUpdateItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
            examples:
              ItemPatchExample:
                $ref: '#/components/examples/ItemPatchExample'
      responses:
        '200':
          description: The updated item after partial update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundExample:
                  $ref: '#/components/examples/NotFoundExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

    delete:
      summary: Delete item
      description: Permanently deletes an item by its ID.
      operationId: deleteItem
      tags:
        - Items
      responses:
        '204':
          description: Item successfully deleted. No content returned.
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundExample:
                  $ref: '#/components/examples/NotFoundExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorExample'

components:
  schemas:
    Item:
      type: object
      description: A fully populated item resource, including the server-assigned ID.
      required:
        - id
        - sku
        - name
      properties:
        id:
          type: integer
          description: Unique sequential identifier assigned by the server. Read-only.
          readOnly: true
          example: 1
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          example: Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: A small blue widget used in assembly line B.

    ItemCreate:
      type: object
      description: Payload for creating or fully replacing an item. The `id` is assigned by the server and must not be provided.
      required:
        - sku
        - name
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          example: Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: A small blue widget used in assembly line B.

    ItemPatch:
      type: object
      description: Payload for partially updating an item. All fields are optional; only provided fields are updated.
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-001-REV2
        name:
          type: string
          description: Human-readable name of the item.
          example: Blue Widget Revised
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: Updated description for the blue widget.

    ItemList:
      type: object
      description: A paginated list of items.
      required:
        - total
        - next
        - prev
        - items
      properties:
        total:
          type: integer
          description: Total number of item records across all pages.
          example: 42
        next:
          type: string
          nullable: true
          description: URL to the next page of results, or null if this is the last page.
          example: /api/v1/items?page=3&size=20
        prev:
          type: string
          nullable: true
          description: URL to the previous page of results, or null if this is the first page.
          example: /api/v1/items?page=1&size=20
        items:
          type: array
          description: Array of item objects for the current page.
          items:
            $ref: '#/components/schemas/Item'

    Error:
      type: object
      description: A standard error response body.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code or application-specific error code.
          example: 404
        message:
          type: string
          description: Human-readable description of the error.
          example: Item not found.

  examples:
    ItemExample:
      summary: A sample item object
      value:
        id: 1
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    ItemCreateExample:
      summary: A sample create/replace payload
      value:
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    ItemPatchExample:
      summary: A sample partial-update payload
      value:
        name: Blue Widget Revised
        description: Updated description for the blue widget.

    ItemListExample:
      summary: A sample paginated list response
      value:
        total: 42
        next: /api/v1/items?page=3&size=20
        prev: /api/v1/items?page=1&size=20
        items:
          - id: 21
            sku: WIDGET-021
            name: Green Widget
            description: A medium green widget for outdoor use.
          - id: 22
            sku: WIDGET-022
            name: Red Widget
            description: null

    InternalServerErrorExample:
      summary: A 500 internal server error response
      value:
        code: 500
        message: An unexpected error occurred. Please try again later.

    NotFoundExample:
      summary: A 404 not-found error response
      value:
        code: 404
        message: Item not found.

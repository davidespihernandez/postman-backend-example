openapi: 3.0.3
info:
  title: Items CRUD API
  description: A production-quality REST API for managing items with full CRUD support.
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging.api.example.com/v1
    description: Staging server

tags:
  - name: Items
    description: Operations on item resources

paths:
  /items:
    get:
      summary: List items
      description: Returns a paginated list of all items.
      operationId: listItems
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: A paginated list of items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItems'
              examples:
                PaginatedItemsExample:
                  $ref: '#/components/examples/PaginatedItemsExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

    post:
      summary: Create item
      description: Creates a new item and returns the created resource.
      operationId: createItem
      tags:
        - Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
            examples:
              CreateItemRequest:
                $ref: '#/components/examples/CreateItemRequestExample'
      responses:
        '201':
          description: The newly created item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                CreatedItem:
                  $ref: '#/components/examples/ItemExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

  /items/{id}:
    get:
      summary: Get item by ID
      description: Returns a single item identified by its integer ID.
      operationId: getItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The requested item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                ItemExample:
                  $ref: '#/components/examples/ItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundError:
                  $ref: '#/components/examples/NotFoundErrorExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

    put:
      summary: Replace item
      description: Fully replaces an existing item. All writable fields must be provided.
      operationId: replaceItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
            examples:
              ReplaceItemRequest:
                $ref: '#/components/examples/UpdateItemRequestExample'
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                UpdatedItem:
                  $ref: '#/components/examples/UpdatedItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundError:
                  $ref: '#/components/examples/NotFoundErrorExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

    patch:
      summary: Partial update item
      description: Applies a partial update to an existing item. Only provided fields are changed.
      operationId: patchItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPatch'
            examples:
              PatchItemRequest:
                $ref: '#/components/examples/PatchItemRequestExample'
      responses:
        '200':
          description: The patched item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
              examples:
                PatchedItem:
                  $ref: '#/components/examples/UpdatedItemExample'
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundError:
                  $ref: '#/components/examples/NotFoundErrorExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

    delete:
      summary: Delete item
      description: Permanently deletes an item by its ID.
      operationId: deleteItem
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Item successfully deleted. No content returned.
        '404':
          description: Item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NotFoundError:
                  $ref: '#/components/examples/NotFoundErrorExample'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                InternalServerError:
                  $ref: '#/components/examples/InternalServerErrorExample'

components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: The integer ID of the item.
      schema:
        type: integer
        example: 42

    PageParam:
      name: page
      in: query
      required: false
      description: Page number (1-based).
      schema:
        type: integer
        default: 1
        minimum: 1
        example: 1

    SizeParam:
      name: size
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
        example: 20

  schemas:
    Item:
      type: object
      description: A fully-hydrated item resource as returned by the server.
      required:
        - id
        - sku
        - name
      properties:
        id:
          type: integer
          readOnly: true
          description: Internal sequential identifier assigned by the server.
          example: 42
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          example: Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: A small blue widget used in assembly line B.

    ItemCreate:
      type: object
      description: Payload for creating a new item. The `id` field is assigned by the server and must not be provided.
      required:
        - sku
        - name
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-001
        name:
          type: string
          description: Human-readable name of the item.
          example: Blue Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: A small blue widget used in assembly line B.

    ItemUpdate:
      type: object
      description: Payload for fully replacing an existing item. All writable fields are required.
      required:
        - sku
        - name
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-002
        name:
          type: string
          description: Human-readable name of the item.
          example: Red Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: A small red widget used in assembly line A.

    ItemPatch:
      type: object
      description: Payload for partially updating an existing item. All fields are optional; only provided fields are changed.
      properties:
        sku:
          type: string
          description: Unique stock-keeping unit identifier for the item.
          example: WIDGET-002
        name:
          type: string
          description: Human-readable name of the item.
          example: Red Widget
        description:
          type: string
          nullable: true
          description: Optional longer description of the item.
          example: Updated description for the widget.

    PaginatedItems:
      type: object
      description: A paginated envelope wrapping a list of items.
      required:
        - total
        - next
        - prev
        - items
      properties:
        total:
          type: integer
          description: Total number of item records across all pages.
          example: 157
        next:
          type: string
          nullable: true
          description: Absolute URL to the next page of results, or null if this is the last page.
          example: 'https://api.example.com/v1/items?page=3&size=20'
        prev:
          type: string
          nullable: true
          description: Absolute URL to the previous page of results, or null if this is the first page.
          example: 'https://api.example.com/v1/items?page=1&size=20'
        items:
          type: array
          description: The list of item objects on the current page.
          items:
            $ref: '#/components/schemas/Item'

    Error:
      type: object
      description: Standard error response body.
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code mirrored in the body for convenience.
          example: 404
        message:
          type: string
          description: Human-readable description of the error.
          example: Item with id 42 was not found.

  examples:
    ItemExample:
      summary: A single item
      value:
        id: 42
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    PaginatedItemsExample:
      summary: Paginated list of items (page 2 of 8)
      value:
        total: 157
        next: 'https://api.example.com/v1/items?page=3&size=20'
        prev: 'https://api.example.com/v1/items?page=1&size=20'
        items:
          - id: 21
            sku: WIDGET-001
            name: Blue Widget
            description: A small blue widget used in assembly line B.
          - id: 22
            sku: GADGET-007
            name: Silver Gadget
            description: null
          - id: 23
            sku: PART-XZ9
            name: XZ9 Replacement Part
            description: Replacement part for model XZ9 machinery.

    CreateItemRequestExample:
      summary: Create a new item
      value:
        sku: WIDGET-001
        name: Blue Widget
        description: A small blue widget used in assembly line B.

    UpdateItemRequestExample:
      summary: Fully replace an item
      value:
        sku: WIDGET-002
        name: Red Widget
        description: A small red widget used in assembly line A.

    PatchItemRequestExample:
      summary: Partially update an item (name only)
      value:
        name: Green Widget

    UpdatedItemExample:
      summary: Item after update
      value:
        id: 42
        sku: WIDGET-002
        name: Red Widget
        description: A small red widget used in assembly line A.

    NotFoundErrorExample:
      summary: Item not found error
      value:
        code: 404
        message: Item with id 42 was not found.

    InternalServerErrorExample:
      summary: Internal server error
      value:
        code: 500
        message: An unexpected error occurred. Please try again later.